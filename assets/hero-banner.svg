<svg width="880" height="260" viewBox="0 0 880 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#090d16" stop-opacity="1"/>
      <stop offset="100%" stop-color="#040711" stop-opacity="1"/>
    </radialGradient>
    
    <radialGradient id="cyanAmbient" cx="15%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="violetAmbient" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Linear Gradient with Shimmer Animation -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4"/>
      <circle cx="30" cy="0" r="1" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <!-- Text Gradients -->
    <linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="roleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    @keyframes scanLine {
      0% { transform: translateY(0); opacity: 0.1; }
      50% { opacity: 0.35; }
      100% { transform: translateY(260px); opacity: 0.1; }
    }
    @keyframes floatBeam {
      0%, 100% { opacity: 0.3; transform: translateX(0); }
      50% { opacity: 0.7; transform: translateX(15px); }
    }
    .pulsing-dot { animation: pulseDot 2.2s infinite ease-in-out; transform-origin: 820px 40px; }
    .scan-runner { animation: scanLine 6s infinite linear; }
    .code-font { font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
    .display-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
  </style>

  <!-- Base Canvas -->
  <rect width="880" height="260" rx="16" fill="url(#bgGlow)"/>
  <rect width="880" height="260" rx="16" fill="url(#techGrid)"/>
  <rect width="880" height="260" rx="16" fill="url(#cyanAmbient)"/>
  <rect width="880" height="260" rx="16" fill="url(#violetAmbient)"/>

  <!-- Scanning laser line -->
  <line x1="16" y1="0" x2="864" y2="0" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" class="scan-runner"/>

  <!-- Outer Glassmorphic Border -->
  <rect x="1" y="1" width="878" height="258" rx="15" fill="none" stroke="url(#borderGlow)" stroke-width="1.2"/>

  <!-- Window Header / Top Bar -->
  <rect x="2" y="2" width="876" height="42" rx="14" fill="#0b1322" fill-opacity="0.65"/>
  <line x1="2" y1="44" x2="878" y2="44" stroke="#1e293b" stroke-width="1"/>

  <!-- macOS Window Controls -->
  <circle cx="34" cy="23" r="5.5" fill="#f43f5e" fill-opacity="0.85"/>
  <circle cx="52" cy="23" r="5.5" fill="#fbbf24" fill-opacity="0.85"/>
  <circle cx="70" cy="23" r="5.5" fill="#10b981" fill-opacity="0.85"/>

  <!-- Terminal Title Breadcrumb -->
  <text x="96" y="28" fill="#64748b" font-size="12" class="code-font" font-weight="500">
    system_core <tspan fill="#334155">/</tspan> <tspan fill="#94a3b8">shaikh-akbar-ali</tspan> <tspan fill="#334155">/</tspan> <tspan fill="#38bdf8">agentic-runtime.py</tspan>
  </text>

  <!-- Live Status Pulse Pill -->
  <rect x="696" y="12" width="160" height="22" rx="11" fill="#032b21" stroke="#059669" stroke-width="1" stroke-opacity="0.6"/>
  <circle cx="710" cy="23" r="4" fill="#10b981" class="pulsing-dot"/>
  <text x="722" y="27" fill="#34d399" font-size="10.5" class="code-font" font-weight="600" letter-spacing="0.4">SYSTEM: ACTIVE</text>

  <!-- Main Hero Typography -->
  <g transform="translate(40, 76)">
    <!-- Eyebrow -->
    <text x="0" y="22" fill="#38bdf8" font-size="12" class="code-font" font-weight="600" letter-spacing="2">
      // APPLIED AI &amp; AUTONOMOUS SYSTEMS
    </text>

    <!-- Full Name -->
    <text x="0" y="66" fill="url(#nameGradient)" font-size="40" class="display-font" font-weight="800" letter-spacing="-1">
      Shaikh Akbar Ali
    </text>

    <!-- Engineering Role -->
    <text x="0" y="98" fill="url(#roleGradient)" font-size="19" class="display-font" font-weight="600" letter-spacing="-0.2">
      AI Engineer · LangGraph Multi-Agent Systems · Production Hybrid RAG
    </text>

    <!-- Location & Target -->
    <text x="0" y="126" fill="#94a3b8" font-size="13" class="code-font">
      📍 Mumbai, India &nbsp;•&nbsp; <tspan fill="#38bdf8">FastAPI</tspan> &nbsp;•&nbsp; <tspan fill="#818cf8">Docker</tspan> &nbsp;•&nbsp; <tspan fill="#c084fc">AstraDB</tspan> &nbsp;•&nbsp; <tspan fill="#34d399">Supabase</tspan>
    </text>
  </g>

  <!-- Modern Interactive Architecture Pill Badges (Right Bottom) -->
  <g transform="translate(520, 192)">
    <rect x="0" y="0" width="164" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="12" cy="14" r="3" fill="#38bdf8"/>
    <text x="24" y="18" fill="#e2e8f0" font-size="11" class="code-font">LangGraph Router</text>

    <rect x="174" y="0" width="146" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="186" cy="14" r="3" fill="#a855f7"/>
    <text x="198" y="18" fill="#e2e8f0" font-size="11" class="code-font">Hybrid RAG (RRF)</text>
  </g>
</svg>
